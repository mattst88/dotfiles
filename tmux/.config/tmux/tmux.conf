set-option -sa terminal-features ',linux:RGB'
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -sa terminal-features ',xterm-kitty:RGB'

unbind-key C-b
bind-key C-a send-prefix
set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
# Don't use "${TERM}"/"${SHELL}": these expand from the tmux *server's*
# environment when the server starts. A server started without TERM set
# (systemd unit, ssh -T, script) leaves default-terminal empty, so every pane
# gets an empty TERM and curses programs fail, locally and over ssh.
set -g default-terminal "tmux-256color"
set -g default-shell "/bin/zsh"
set -g focus-events on
set -g mouse
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -gw mode-keys vi

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'wfxr/tmux-fzf-url'

run '~/.tmux/plugins/tpm/tpm'
